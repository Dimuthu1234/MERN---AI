<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 - State & Events | AcademyDSJ Session 3</title>

    <!--
        ============================================================
        AcademyDSJ - Session 3: State & Events
        ============================================================
        මේ file එකෙන් ඉගෙන ගන්නවා:
        - useState hook එක use කරන විදිය
        - Counter example (increment, decrement, reset)
        - Value අනුව color change කරන විදිය
        - Input handling (controlled components)
        - Form example
        - Multiple state variables
        ============================================================
    -->

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background: #0f172a; color: #e2e8f0; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        // useState hook import — CDN version එකේ React object එකෙන් ගන්නවා
        const { useState } = React;


        // ============================================================
        // SECTION 1: Basic Counter — useState හඳුන්වා දීම
        // Introduction to useState with a Counter
        // ============================================================

        /**
         * useState Hook — React වල වඩාත්ම basic hook එක
         * The most fundamental React hook
         *
         * Syntax:
         *   const [stateValue, setStateValue] = useState(initialValue);
         *
         * - stateValue     = current value (දැන් තියෙන value එක)
         * - setStateValue  = updater function (value change කරන function එක)
         * - initialValue   = starting value (පළමු value එක)
         *
         * RULES (නීති):
         * 1. useState component function එක ඇතුලේ call කරන්න ඕනි (top level)
         * 2. Conditionals/loops ඇතුලේ call කරන්න බැහැ
         * 3. State change වුණාම component AUTOMATICALLY re-render වෙනවා!
         * 4. State directly modify කරන්න එපා (count = 5 ← WRONG!)
         *    Always use the setter: setCount(5) ✅
         */
        function BasicCounter() {
            // useState(0) — initial value = 0
            // count = current value, setCount = update function
            const [count, setCount] = useState(0);

            return (
                <div className="bg-slate-800 rounded-xl p-6 mb-6">
                    <h3 className="text-xl font-bold text-white mb-4">Basic Counter</h3>

                    <div className="text-center">
                        {/* count value display — state change වුණාම auto update */}
                        <p className="text-6xl font-bold text-cyan-400 mb-6">{count}</p>

                        <div className="flex justify-center gap-3">
                            {/*
                                onClick event handler — button click කලාම function run වෙනවා.
                                Arrow function ඇතුලේ setCount call කරනවා.
                                setCount(count + 1) — current value + 1 set කරනවා.
                            */}
                            <button
                                onClick={() => setCount(count + 1)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-medium transition-colors"
                            >
                                + Increment
                            </button>

                            <button
                                onClick={() => setCount(count - 1)}
                                className="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-medium transition-colors"
                            >
                                - Decrement
                            </button>

                            {/* Reset — setCount(0) initial value එකට set කරනවා */}
                            <button
                                onClick={() => setCount(0)}
                                className="bg-slate-600 hover:bg-slate-500 text-white px-6 py-2 rounded-lg font-medium transition-colors"
                            >
                                Reset
                            </button>
                        </div>
                    </div>
                </div>
            );
        }


        // ============================================================
        // SECTION 2: Color Changing Counter — State අනුව UI Change කරමු
        // Counter with Dynamic Colors Based on Value
        // ============================================================

        /**
         * State value එක අනුව UI dynamically change කරන්න පුළුවන්.
         * UI can dynamically change based on state value.
         *
         * Positive → Green
         * Zero → Cyan
         * Negative → Red
         *
         * prev => prev + 1 syntax — SAFEST way to update state!
         * මේ syntax එකෙන් previous value එක guarantee වෙනවා.
         */
        function ColorCounter() {
            const [count, setCount] = useState(0);

            // Count value එක අනුව color determine කරන්න
            const getColor = () => {
                if (count > 0) return 'text-emerald-400';
                if (count < 0) return 'text-red-400';
                return 'text-cyan-400';
            };

            const getBgColor = () => {
                if (count > 0) return 'bg-emerald-500/10 border-emerald-500/30';
                if (count < 0) return 'bg-red-500/10 border-red-500/30';
                return 'bg-cyan-500/10 border-cyan-500/30';
            };

            return (
                <div className="bg-slate-800 rounded-xl p-6 mb-6">
                    <h3 className="text-xl font-bold text-white mb-4">Color Counter</h3>
                    <p className="text-slate-500 text-sm mb-4">
                        Value අනුව color change වෙනවා — Positive=Green, Zero=Cyan, Negative=Red
                    </p>

                    <div className={`text-center p-8 rounded-xl border ${getBgColor()} transition-all duration-300`}>
                        <p className={`text-7xl font-bold ${getColor()} transition-colors duration-300`}>
                            {count}
                        </p>
                        <p className="text-slate-500 text-sm mt-2">
                            {count > 0 ? 'Positive! 📈' : count < 0 ? 'Negative! 📉' : 'Zero — Neutral 😐'}
                        </p>
                    </div>

                    <div className="flex justify-center gap-3 mt-6">
                        {/*
                            prev => prev + 1 — Functional update form
                            මේක use කරන්න ඕනි previous state value එක based update කරන විට.
                            Batch updates වලදී safe — multiple rapid clicks එකේදී accurate.
                        */}
                        <button
                            onClick={() => setCount(prev => prev + 5)}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium transition-colors"
                        >
                            +5
                        </button>
                        <button
                            onClick={() => setCount(prev => prev + 1)}
                            className="bg-emerald-700 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium transition-colors"
                        >
                            +1
                        </button>
                        <button
                            onClick={() => setCount(0)}
                            className="bg-slate-600 hover:bg-slate-500 text-white px-5 py-2 rounded-lg font-medium transition-colors"
                        >
                            0
                        </button>
                        <button
                            onClick={() => setCount(prev => prev - 1)}
                            className="bg-red-700 hover:bg-red-600 text-white px-5 py-2 rounded-lg font-medium transition-colors"
                        >
                            -1
                        </button>
                        <button
                            onClick={() => setCount(prev => prev - 5)}
                            className="bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-lg font-medium transition-colors"
                        >
                            -5
                        </button>
                    </div>
                </div>
            );
        }


        // ============================================================
        // SECTION 3: Input Handling — Controlled Components
        // Input Fields Control කරමු
        // ============================================================

        /**
         * Controlled Component — React state එකෙන් input value control කරන component.
         * A controlled component = input value is driven by React state.
         *
         * Pattern:
         *   1. State variable එකක් create කරන්න: const [name, setName] = useState('')
         *   2. Input value එකට state set කරන්න: value={name}
         *   3. onChange event එකෙන් state update කරන්න: onChange={(e) => setName(e.target.value)}
         *
         * e.target.value — input field එකේ current value එක ගන්නවා.
         * e = event object, e.target = input element එක
         */
        function InputDemo() {
            const [name, setName] = useState('');
            const [message, setMessage] = useState('');

            return (
                <div className="bg-slate-800 rounded-xl p-6 mb-6">
                    <h3 className="text-xl font-bold text-white mb-4">Controlled Inputs</h3>
                    <p className="text-slate-500 text-sm mb-4">
                        Type කරද්දී state update වෙනවා → UI automatically re-render වෙනවා
                    </p>

                    <div className="space-y-4">
                        {/* Text input — state එකෙන් control කරනවා */}
                        <div>
                            <label className="block text-slate-400 text-sm mb-1">Your Name:</label>
                            <input
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="Type your name..."
                                className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500"
                            />
                        </div>

                        <div>
                            <label className="block text-slate-400 text-sm mb-1">Message:</label>
                            <textarea
                                value={message}
                                onChange={(e) => setMessage(e.target.value)}
                                placeholder="Type a message..."
                                rows={3}
                                className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 resize-none"
                            />
                        </div>

                        {/* Live preview — state change වුණාම immediately update */}
                        <div className="bg-slate-700/50 rounded-lg p-4">
                            <p className="text-slate-400 text-xs mb-2">LIVE PREVIEW:</p>
                            <p className="text-cyan-400 text-lg font-medium">
                                {name ? `Hello, ${name}!` : 'Start typing your name...'}
                            </p>
                            {message && (
                                <p className="text-slate-300 mt-1">{message}</p>
                            )}
                            <p className="text-slate-600 text-xs mt-2">
                                Characters: {name.length + message.length}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }


        // ============================================================
        // SECTION 4: Form Example — Multiple States එකට Use කරමු
        // Form with Multiple State Variables
        // ============================================================

        /**
         * Form එකකදී multiple state variables use කරන්න ඕනි.
         * Each input field needs its own state variable.
         *
         * Form submit handle කරන විදිය:
         * 1. onSubmit event එක form element එකට add කරන්න
         * 2. e.preventDefault() call කරන්න (page refresh avoid කරන්න)
         * 3. State values process කරන්න
         */
        function RegistrationForm() {
            // Multiple state variables — each input has its own state
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                batch: '2026-A'
            });
            const [submitted, setSubmitted] = useState(false);
            const [submittedData, setSubmittedData] = useState(null);

            /**
             * handleChange — ඕනෑම input field එකකට use කරන්න පුළුවන්!
             * e.target.name — input element එකේ name attribute එක
             * e.target.value — input element එකේ current value එක
             *
             * Spread operator (...formData) — existing data keep කරලා, changed field update කරනවා.
             * IMPORTANT: Objects/arrays state update කරන විට ALWAYS new copy එකක් හදන්න!
             * ...formData = copy existing, [e.target.name]: e.target.value = update one field
             */
            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleSubmit = (e) => {
                // Default form submission (page reload) prevent කරනවා
                e.preventDefault();
                setSubmittedData({ ...formData });
                setSubmitted(true);
                // Form clear කරන්න
                setFormData({ name: '', email: '', batch: '2026-A' });
            };

            return (
                <div className="bg-slate-800 rounded-xl p-6 mb-6">
                    <h3 className="text-xl font-bold text-white mb-4">Registration Form</h3>

                    {/* Conditional rendering — submitted state එක true නම් success message */}
                    {submitted && submittedData && (
                        <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-4 mb-4">
                            <p className="text-emerald-400 font-medium">Registration Successful! ✅</p>
                            <p className="text-slate-400 text-sm mt-1">
                                {submittedData.name} ({submittedData.email}) — Batch: {submittedData.batch}
                            </p>
                        </div>
                    )}

                    {/* onSubmit — form submit event handle කරනවා */}
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-slate-400 text-sm mb-1">Full Name:</label>
                            <input
                                type="text"
                                name="name"
                                value={formData.name}
                                onChange={handleChange}
                                required
                                className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500"
                            />
                        </div>

                        <div>
                            <label className="block text-slate-400 text-sm mb-1">Email:</label>
                            <input
                                type="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                required
                                className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500"
                            />
                        </div>

                        <div>
                            <label className="block text-slate-400 text-sm mb-1">Batch:</label>
                            {/* Select dropdown — same handleChange function use කරන්න පුළුවන් */}
                            <select
                                name="batch"
                                value={formData.batch}
                                onChange={handleChange}
                                className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500"
                            >
                                <option value="2026-A">Batch 2026-A</option>
                                <option value="2026-B">Batch 2026-B</option>
                                <option value="2026-C">Batch 2026-C</option>
                            </select>
                        </div>

                        <button
                            type="submit"
                            className="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2 rounded-lg font-medium transition-colors"
                        >
                            Register
                        </button>
                    </form>
                </div>
            );
        }


        // ============================================================
        // SECTION 5: Toggle & Multiple States
        // Toggle Button සහ Multiple States එකට
        // ============================================================

        /**
         * Component එකක state variables කීපයක් use කරන්න පුළුවන්.
         * A single component can have MULTIPLE state variables.
         *
         * useState call කරන හැම වතාවේම separate state variable එකක් create වෙනවා.
         * Each useState call creates an independent state variable.
         */
        function MultipleStates() {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [fontSize, setFontSize] = useState(16);
            const [isOnline, setIsOnline] = useState(true);
            const [likes, setLikes] = useState(42);
            const [hasLiked, setHasLiked] = useState(false);

            const handleLike = () => {
                if (hasLiked) {
                    setLikes(prev => prev - 1);
                    setHasLiked(false);
                } else {
                    setLikes(prev => prev + 1);
                    setHasLiked(true);
                }
            };

            return (
                <div className="bg-slate-800 rounded-xl p-6 mb-6">
                    <h3 className="text-xl font-bold text-white mb-4">Multiple State Variables</h3>
                    <p className="text-slate-500 text-sm mb-4">
                        එක component එකේ states කීපයක් — each independent!
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {/* Toggle: Dark/Light mode */}
                        <div className={`rounded-lg p-4 border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-300' : 'bg-white border-gray-300 text-gray-800'} transition-all duration-300`}>
                            <p className="font-medium mb-2">Theme: {isDarkMode ? 'Dark' : 'Light'}</p>
                            <button
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-1 rounded text-sm transition-colors"
                            >
                                Toggle Theme
                            </button>
                        </div>

                        {/* Font size controller */}
                        <div className="bg-slate-700/50 rounded-lg p-4 border border-slate-600">
                            <p style={{ fontSize: `${fontSize}px` }} className="text-cyan-400 mb-2">
                                Font Size: {fontSize}px
                            </p>
                            <div className="flex gap-2">
                                <button
                                    onClick={() => setFontSize(prev => Math.max(12, prev - 2))}
                                    className="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1 rounded text-sm transition-colors"
                                >
                                    A-
                                </button>
                                <button
                                    onClick={() => setFontSize(16)}
                                    className="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1 rounded text-sm transition-colors"
                                >
                                    Reset
                                </button>
                                <button
                                    onClick={() => setFontSize(prev => Math.min(32, prev + 2))}
                                    className="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1 rounded text-sm transition-colors"
                                >
                                    A+
                                </button>
                            </div>
                        </div>

                        {/* Online/Offline toggle */}
                        <div className="bg-slate-700/50 rounded-lg p-4 border border-slate-600">
                            <div className="flex items-center gap-2 mb-2">
                                <span className={`w-3 h-3 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-red-400'}`}></span>
                                <p className="text-slate-300">Status: {isOnline ? 'Online' : 'Offline'}</p>
                            </div>
                            <button
                                onClick={() => setIsOnline(!isOnline)}
                                className={`px-4 py-1 rounded text-sm text-white transition-colors ${
                                    isOnline ? 'bg-red-600 hover:bg-red-500' : 'bg-emerald-600 hover:bg-emerald-500'
                                }`}
                            >
                                Go {isOnline ? 'Offline' : 'Online'}
                            </button>
                        </div>

                        {/* Like button — 2 states එකට update */}
                        <div className="bg-slate-700/50 rounded-lg p-4 border border-slate-600">
                            <p className="text-slate-300 mb-2">AcademyDSJ Post</p>
                            <button
                                onClick={handleLike}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                                    hasLiked
                                        ? 'bg-pink-500/20 text-pink-400 border border-pink-500/30'
                                        : 'bg-slate-600 text-slate-300 border border-slate-500'
                                }`}
                            >
                                {hasLiked ? '❤️' : '🤍'} {likes} Likes
                            </button>
                        </div>
                    </div>
                </div>
            );
        }


        // ============================================================
        // APP — Main Component
        // ============================================================

        function App() {
            return (
                <div className="min-h-screen bg-slate-900">
                    <div className="max-w-2xl mx-auto px-4 py-8">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-cyan-500/10 to-emerald-500/10 rounded-xl p-6 text-center mb-8">
                            <h1 className="text-3xl font-bold text-cyan-400">
                                State & Events ⚛️
                            </h1>
                            <p className="text-slate-400 mt-2">
                                AcademyDSJ Session 3 — useState Hook & Event Handling
                            </p>
                        </div>

                        {/* Section headers with demos */}
                        <div className="flex items-center gap-3 mb-4">
                            <span className="bg-cyan-500/20 text-cyan-400 text-xs font-mono px-2 py-1 rounded">01</span>
                            <h2 className="text-lg font-bold text-white">Basic Counter — useState Introduction</h2>
                        </div>
                        <BasicCounter />

                        <div className="flex items-center gap-3 mb-4 mt-8">
                            <span className="bg-cyan-500/20 text-cyan-400 text-xs font-mono px-2 py-1 rounded">02</span>
                            <h2 className="text-lg font-bold text-white">Color Counter — Dynamic UI Based on State</h2>
                        </div>
                        <ColorCounter />

                        <div className="flex items-center gap-3 mb-4 mt-8">
                            <span className="bg-cyan-500/20 text-cyan-400 text-xs font-mono px-2 py-1 rounded">03</span>
                            <h2 className="text-lg font-bold text-white">Controlled Inputs — Input Handling</h2>
                        </div>
                        <InputDemo />

                        <div className="flex items-center gap-3 mb-4 mt-8">
