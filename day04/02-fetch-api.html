<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 04 - Fetch API Data | AcademyDSJ</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #2dd4bf; margin-bottom: 5px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin: 10px 0; border: 1px solid #334155; cursor: pointer; transition: border-color 0.2s; }
    .card:hover { border-color: #2dd4bf; }
    .card h3 { color: #2dd4bf; font-size: 15px; margin-bottom: 6px; }
    .card p { color: #94a3b8; font-size: 13px; line-height: 1.5; }
    .spinner { text-align: center; padding: 40px; font-size: 24px; }
    .error { background: #450a0a; border: 1px solid #dc2626; border-radius: 8px; padding: 16px; text-align: center; color: #fca5a5; }
    .search { width: 100%; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin: 15px 0; outline: none; }
    .search:focus { border-color: #2dd4bf; }
    .stats { display: flex; gap: 10px; margin: 10px 0; }
    .stat { background: #1e293b; border-radius: 8px; padding: 8px 14px; font-size: 12px; color: #94a3b8; }
    .stat strong { color: #2dd4bf; }
    button { background: #0d9488; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .detail-view { background: #1e293b; border-radius: 16px; padding: 24px; border: 1px solid #334155; }
    .back-btn { background: #334155; margin-bottom: 16px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [articles, setArticles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);

  // Fetch articles on mount
  useEffect(() => {
    async function fetchArticles() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        setArticles(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    }
    fetchArticles();
  }, []);

  // Filter articles by search
  const filtered = articles.filter(a =>
    a.title.toLowerCase().includes(search.toLowerCase()) ||
    a.body.toLowerCase().includes(search.toLowerCase())
  );

  if (loading) return <div className="spinner">⏳ Loading articles...</div>;
  if (error) return (
    <div className="container">
      <div className="error">
        <p>❌ {error}</p>
        <button onClick={() => window.location.reload()} style={{marginTop: 10}}>🔄 Retry</button>
      </div>
    </div>
  );

  // Detail View
  if (selectedId) {
    const article = articles.find(a => a.id === selectedId);
    return (
      <div className="container">
        <button className="back-btn" onClick={() => setSelectedId(null)}>← Back to Articles</button>
        <div className="detail-view">
          <p style={{color: '#64748b', fontSize: 12, marginBottom: 8}}>Article #{article.id}</p>
          <h2 style={{color: '#2dd4bf', fontSize: 22, marginBottom: 12, textTransform: 'capitalize'}}>{article.title}</h2>
          <p style={{lineHeight: 1.8, color: '#cbd5e1'}}>{article.body}</p>
          <p style={{color: '#64748b', fontSize: 12, marginTop: 16}}>User ID: {article.userId}</p>
        </div>
      </div>
    );
  }

  return (
    <div className="container">
      <h1>📰 News Feed App</h1>
      <p style={{color: '#94a3b8', fontSize: 13}}>Day 04 Mini Project — AcademyDSJ</p>

      <input
        className="search"
        placeholder="🔍 Search articles..."
        value={search}
        onChange={e => setSearch(e.target.value)}
      />

      <div className="stats">
        <div className="stat">Total: <strong>{articles.length}</strong></div>
        <div className="stat">Showing: <strong>{filtered.length}</strong></div>
        {search && <div className="stat">Search: <strong>"{search}"</strong></div>}
      </div>

      {filtered.length === 0 ? (
        <div style={{textAlign: 'center', padding: 40, color: '#64748b'}}>
          No articles found for "{search}"
        </div>
      ) : (
        filtered.slice(0, 20).map(article => (
          <div className="card" key={article.id} onClick={() => setSelectedId(article.id)}>
            <h3>#{article.id} — {article.title}</h3>
            <p>{article.body.substring(0, 100)}...</p>
          </div>
        ))
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
